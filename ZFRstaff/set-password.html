<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Your Password | ZeroFluke Research Assistant</title>
<link rel="icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="admin-set-password" style="background:var(--paper-dim);">

<section class="section" style="padding-block:4rem;">
  <div class="container">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:1.25rem;">
        <img src="../assets/logo.png" alt="ZeroFluke" style="height:40px;">
      </div>
      <h1 style="font-size:var(--step-2);text-align:center;margin-bottom:0.4rem;">Welcome to the Team</h1>
      <p style="text-align:center;font-size:0.9rem;margin-bottom:1.5rem;">Set a password to activate your staff account.</p>

      <div id="statusBox" class="status-box"></div>

      <form id="setPasswordForm">
        <div class="field">
          <label for="sp-password">New password</label>
          <div class="password-wrap">
            <input type="password" id="sp-password" required minlength="8">
            <button type="button" class="password-toggle" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <p class="field-hint">At least 8 characters, with a letter and a number.</p>
        </div>
        <div class="field">
          <label for="sp-confirm">Confirm password</label>
          <div class="password-wrap">
            <input type="password" id="sp-confirm" required minlength="8">
            <button type="button" class="password-toggle" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="setPasswordBtn">Activate Account</button>
      </form>
    </div>
  </div>
</section>

<script src="../js/main.js"></script>
<script src="../js/admin-set-password.js"></script>
</body>
</html>
