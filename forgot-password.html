<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | ZeroFluke Research Assistant</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="forgot-password">

<div data-include="partials/header.html"></div>

<section class="section" style="padding-block:3rem;">
  <div class="container">
    <div class="auth-card">
      <h1 style="font-size:var(--step-2);text-align:center;margin-bottom:0.4rem;">Reset your password</h1>
      <p style="text-align:center;font-size:0.9rem;margin-bottom:1.5rem;">Enter the email on your account and we'll send you a reset link.</p>

      <div id="statusBox" class="status-box"></div>

      <form id="forgotForm">
        <div class="field">
          <label for="fp-email">Email address</label>
          <input type="email" id="fp-email" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="forgotSubmitBtn">Send Reset Link</button>
      </form>

      <p class="text-center field-hint" style="margin-top:1.25rem;">
        Remembered it? <a href="login.html" style="color:var(--royal-blue);font-weight:600;">Log in</a>
      </p>
    </div>
  </div>
</section>

<div data-include="partials/footer.html"></div>
<script src="js/main.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>
