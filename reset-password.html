<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password | ZeroFluke Research Assistant</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reset-password">

<div data-include="partials/header.html"></div>

<section class="section" style="padding-block:3rem;">
  <div class="container">
    <div class="auth-card">
      <h1 style="font-size:var(--step-2);text-align:center;margin-bottom:0.4rem;">Set a New Password</h1>
      <p style="text-align:center;font-size:0.9rem;margin-bottom:1.5rem;">Choose a new password for your account.</p>

      <div id="statusBox" class="status-box"></div>

      <form id="resetForm">
        <div class="field">
          <label for="rp-password">New password</label>
          <div class="password-wrap">
            <input type="password" id="rp-password" required minlength="6">
            <button type="button" class="password-toggle" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <div class="field">
          <label for="rp-confirm">Confirm new password</label>
          <div class="password-wrap">
            <input type="password" id="rp-confirm" required minlength="6">
            <button type="button" class="password-toggle" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="resetSubmitBtn">Update Password</button>
      </form>

      <p class="text-center field-hint" style="margin-top:1.25rem;">
        <a href="login.html" style="color:var(--royal-blue);font-weight:600;">Back to log in</a>
      </p>
    </div>
  </div>
</section>

<div data-include="partials/footer.html"></div>
<script src="js/main.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
