<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | ZeroFluke Research Assistant</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body data-page="signup">

<div data-include="partials/header.html"></div>

<section class="section" style="padding-block:3rem;">
  <div class="container">
    <div class="auth-card">
      <h1 style="font-size:var(--step-2);text-align:center;margin-bottom:0.4rem;">Create your account</h1>
      <p style="text-align:center;font-size:0.9rem;margin-bottom:1.5rem;">You'll need your NIN to place a request.</p>

      <div id="statusBox" class="status-box"></div>

      <div class="google-btn-wrap" id="googleBtnWrap"></div>
      <div class="auth-divider">or sign up with email</div>

      <form id="signupForm">
        <div class="field">
          <label for="su-name">Full name</label>
          <input type="text" id="su-name" required>
        </div>
        <div class="field">
          <label for="su-email">Email address</label>
          <input type="email" id="su-email" required>
        </div>
        <div class="field">
          <label for="su-phone">Phone number</label>
          <input type="tel" id="su-phone" required>
        </div>
        <div class="field">
          <label for="su-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="su-password" required minlength="8">
            <button type="button" class="password-toggle" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <p class="field-hint">At least 8 characters, with a letter and a number.</p>
        </div>
        <div class="field">
          <label for="su-password-confirm">Confirm password</label>
          <div class="password-wrap">
            <input type="password" id="su-password-confirm" required minlength="8">
            <button type="button" class="password-toggle" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <p class="field-hint" id="passwordMatchHint" style="display:none;color:var(--danger);">Passwords do not match.</p>
        </div>
        <div class="field">
          <div class="field-label-row">
            <label for="su-nin" style="margin-bottom:0;">NIN (11 digits)</label>
            <button type="button" class="info-icon" id="ninInfoBtn">i
              <span class="info-popover" id="ninHint">Identity documents provided are used only to verify a client's name and ID number. The document is not uploaded to our server and does not leave this environment.</span>
            </button>
          </div>
          <input type="text" id="su-nin" required maxlength="11" pattern="\d{11}" inputmode="numeric">
        </div>
        <div class="field">
          <label>Upload your NIN (digital slip or paper slip)</label>
          <label class="file-upload" id="fileUploadLabel">
            <input type="file" id="su-id-photo" accept="image/*" required>
            <div class="file-upload-label">Tap to choose a clear photo of your NIN</div>
            <div class="file-upload-name" id="fileUploadName"></div>
          </label>
          <p class="field-hint" id="ocrStatus"></p>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="submitBtn">Create Account</button>
      </form>

      <p class="text-center field-hint" style="margin-top:1.25rem;">
        Already have an account? <a href="login.html" style="color:var(--royal-blue);font-weight:600;">Log in</a>
      </p>
    </div>
  </div>
</section>

<div data-include="partials/footer.html"></div>
<script src="js/main.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
